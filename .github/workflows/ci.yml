name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck

      - name: Generate (static build)
        run: yarn generate
