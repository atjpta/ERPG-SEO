server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Prerendered per-route HTML (nuxt generate) — no SPA fallback needed,
    # every route already exists as a real file on disk.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashed build assets — safe to cache forever.
    location /_nuxt/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
}
